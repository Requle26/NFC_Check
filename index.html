<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#13231f" />
    <title>NFC 감지 화면</title>
    <link rel="stylesheet" href="./styles.css?v=6" />
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <path d="M19 16c7 7 7 25 0 32" />
            <path d="M30 10c11 11 11 33 0 44" />
            <path d="M42 5c15 15 15 39 0 54" />
          </svg>
        </div>
        <div>
          <p class="eyebrow">Android Chrome</p>
          <h1 id="page-title">NFC 감지</h1>
        </div>
      </section>

      <section class="reader" aria-label="NFC 리더">
        <div class="status-row">
          <span id="support-dot" class="dot" aria-hidden="true"></span>
          <p id="support-message">지원 상태 확인 중</p>
        </div>

        <div id="scan-state" class="scan-state idle" aria-live="polite">
          <span class="pulse" aria-hidden="true"></span>
          <div>
            <strong id="scan-title">대기 중</strong>
            <span id="scan-detail">스캔을 시작하면 감지 결과가 여기에 표시됩니다.</span>
          </div>
        </div>

        <div class="actions">
          <button id="scan-button" class="primary" type="button">스캔 시작</button>
          <button id="stop-button" class="secondary" type="button" disabled>중지</button>
          <button id="clear-button" class="ghost" type="button">기록 지우기</button>
        </div>
      </section>

      <section class="results" aria-labelledby="results-title">
        <div class="section-head">
          <h2 id="results-title">감지 기록</h2>
          <span id="count-badge">0개</span>
        </div>
        <div id="empty-state" class="empty">아직 감지된 NFC 태그가 없습니다.</div>
        <ol id="result-list" class="result-list"></ol>
      </section>
    </main>

    <template id="record-template">
      <li class="result-item">
        <article>
          <header>
            <div>
              <strong class="record-title"></strong>
              <span class="record-time"></span>
            </div>
            <span class="record-serial"></span>
          </header>
          <dl class="record-list"></dl>
        </article>
      </li>
    </template>

    <script src="./app.js?v=6" defer></script>
  </body>
</html>
